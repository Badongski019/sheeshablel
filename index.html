<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Hand Tracking Magic ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        video {
            display: none;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #status {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;

            text-align: center;
            color: #ffb6c1;
            font-size: 16px;
            line-height: 1.5;

            text-shadow: 0 0 10px rgba(255,182,193,0.8);

            z-index: 10;
            pointer-events: none;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 20;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px;
            text-align: center;

            background:
                radial-gradient(circle at center,
                rgba(255, 77, 109, 0.18),
                transparent 45%),
                #050505;
        }

        #startScreen h1 {
            color: #ff4d6d;
            margin-bottom: 10px;
            font-size: 28px;
        }

        #startScreen p {
            color: #ddd;
            max-width: 320px;
            line-height: 1.5;
        }

        #startButton {
            margin-top: 20px;
            padding: 15px 28px;

            border: none;
            border-radius: 30px;

            background: #ff4d6d;
            color: white;

            font-size: 17px;
            font-weight: bold;

            box-shadow: 0 0 25px rgba(255,77,109,0.5);
        }

        #startButton:active {
            transform: scale(0.95);
        }

        #error {
            margin-top: 20px;
            color: #ff8fa3;
            font-size: 14px;
            max-width: 320px;
        }
    </style>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
            crossorigin="anonymous"></script>
</head>

<body>

    <div id="startScreen">

        <h1>❤️ Hand Tracking Magic</h1>

        <p>
            Gamitin ang camera para sa hand tracking.
            <br><br>
            ✌️ Peace — Heart
            <br>
            ✊ Fist — Love Particles
            <br>
            🖐️ Open Hand — Love Letter
        </p>

        <button id="startButton">
            Open Camera 📷
        </button>

        <div id="error"></div>

    </div>

    <div id="status">
        I-angat ang kamay sa camera...
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <canvas id="canvas"></canvas>

<script>

const videoElement = document.getElementById("webcam");
const canvasElement = document.getElementById("canvas");
const canvasCtx = canvasElement.getContext("2d");

const statusEl = document.getElementById("status");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorEl = document.getElementById("error");

let width;
let height;

let particles = [];
let currentGesture = "NONE";


// ==========================================
// 💌 LOVE LETTER
// ==========================================

const loveLetter =
    "Hi mahal! ❤️ Sana magustuhan mo 'to. " +
    "Ginawa ko 'to para sa'yo. " +
    "Ikaw ang nagpapasaya sa araw-araw ko. " +
    "I love you! ❤️";


// ==========================================
// 📐 CANVAS
// ==========================================

function resizeCanvas() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvasElement.width = width;
    canvasElement.height = height;
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


// ==========================================
// ✨ PARTICLE
// ==========================================

class Particle {

    constructor(targetX, targetY, color) {

        this.x = Math.random() * width;
        this.y = Math.random() * height;

        this.targetX = targetX;
        this.targetY = targetY;

        this.vx = 0;
        this.vy = 0;

        this.color = color;

        this.size = Math.random() * 3 + 1;
    }

    update() {

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;

        this.vx = dx * 0.08;
        this.vy = dy * 0.08;

        this.x += this.vx;
        this.y += this.vy;
    }

    draw() {

        canvasCtx.fillStyle = this.color;

        canvasCtx.beginPath();

        canvasCtx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        canvasCtx.fill();
    }
}


// ==========================================
// ❤️ HEART
// ==========================================

function createHeartShape(count) {

    particles = [];

    for (let i = 0; i < count; i++) {

        const t = Math.random() * Math.PI * 2;

        const x =
            16 * Math.pow(Math.sin(t), 3);

        const y =
            -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t));

        const targetX =
            width / 2 + x * Math.min(width, height) / 35;

        const targetY =
            height / 2 + y * Math.min(width, height) / 35;

        particles.push(
            new Particle(
                targetX,
                targetY,
                "#ff4d6d"
            )
        );
    }
}


// ==========================================
// 💌 TEXT
// ==========================================

function createTextShape(text) {

    particles = [];

    const tempCanvas =
        document.createElement("canvas");

    const tempCtx =
        tempCanvas.getContext("2d");

    tempCanvas.width = width;
    tempCanvas.height = height;

    const fontSize =
        Math.max(18, Math.min(width / 18, 26));

    tempCtx.fillStyle = "white";

    tempCtx.font =
        `bold ${fontSize}px Arial`;

    tempCtx.textAlign = "left";

    const words = text.split(" ");

    let line = "";

    const lines = [];

    const maxWidth = width - 50;

    let y = 130;

    for (let i = 0; i < words.length; i++) {

        const testLine =
            line + words[i] + " ";

        const metrics =
            tempCtx.measureText(testLine);

        if (
            metrics.width > maxWidth &&
            line !== ""
        ) {

            lines.push(line);

            line = words[i] + " ";

        } else {

            line = testLine;
        }
    }

    lines.push(line);

    lines.forEach((lineText, index) => {

        tempCtx.fillText(
            lineText,
            25,
            y + index * (fontSize + 15)
        );
    });


    const imgData =
        tempCtx.getImageData(
            0,
            0,
            width,
            height
        );

    const pixels = imgData.data;


    for (
        let yCoord = 0;
        yCoord < height;
        yCoord += 5
    ) {

        for (
            let xCoord = 0;
            xCoord < width;
            xCoord += 5
        ) {

            const index =
                (yCoord * width + xCoord) * 4;

            if (pixels[index + 3] > 128) {

                particles.push(
                    new Particle(
                        xCoord,
                        yCoord,
                        "#00ffff"
                    )
                );
            }
        }
    }
}


// ==========================================
// ✋ GESTURE RECOGNITION
// ==========================================

function recognizeGesture(landmarks) {

    const isExtended = (tip, base) => {

        const tipDistance =
            Math.hypot(
                landmarks[tip].x - landmarks[0].x,
                landmarks[tip].y - landmarks[0].y
            );

        const baseDistance =
            Math.hypot(
                landmarks[base].x - landmarks[0].x,
                landmarks[base].y - landmarks[0].y
            );

        return tipDistance > baseDistance * 1.15;
    };


    const indexUp =
        isExtended(8, 6);

    const middleUp =
        isExtended(12, 10);

    const ringUp =
        isExtended(16, 14);

    const pinkyUp =
        isExtended(20, 18);


    // ✌️ PEACE

    if (
        indexUp &&
        middleUp &&
        !ringUp &&
        !pinkyUp
    ) {

        return "PEACE";
    }


    // ✊ FIST

    if (
        !indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp
    ) {

        return "FIST";
    }


    // 🖐️ OPEN HAND

    if (
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp
    ) {

        return "OPEN";
    }


    return currentGesture;
}


// ==========================================
// 🎯 MEDIAPIPE RESULTS
// ==========================================

function onResults(results) {

    canvasCtx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const landmarks =
            results.multiHandLandmarks[0];

        const detected =
            recognizeGesture(landmarks);


        if (detected !== currentGesture) {

            currentGesture = detected;


            if (currentGesture === "PEACE") {

                statusEl.innerText =
                    "❤️ Heart Formed!";

                createHeartShape(350);
            }


            else if (currentGesture === "FIST") {

                statusEl.innerText =
                    "💖 I Love You!";

                createHeartShape(450);
            }


            else if (currentGesture === "OPEN") {

                statusEl.innerText =
                    "💌 Letter Unlocked!";

                createTextShape(loveLetter);
            }
        }

    } else {

        statusEl.innerText =
            "I-pakita ang kamay ✋";
    }


    particles.forEach(p => {

        p.update();
        p.draw();

    });
}


// ==========================================
// 🖐️ MEDIAPIPE HANDS
// ==========================================

const hands = new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults(onResults);


// ==========================================
// 📷 CAMERA
// ==========================================

let camera;


// ==========================================
// 🚀 START CAMERA
// ==========================================

async function startCamera() {

    errorEl.innerText = "";

    startButton.disabled = true;

    startButton.innerText =
        "Requesting Camera...";


    try {

        // Check browser support

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Camera API is not supported by this browser."
            );
        }


        // Request camera permission

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }
                },

                audio: false
            });


        // Give stream to video

        videoElement.srcObject = stream;

        await videoElement.play();


        // Start MediaPipe camera

        camera = new Camera(
            videoElement,
            {

                onFrame: async () => {

                    await hands.send({
                        image: videoElement
                    });

                },

                width: 640,

                height: 480

            }
        );


        camera.start();


        // Hide start screen

        startScreen.style.display =
            "none";


        statusEl.innerText =
            "I-angat ang kamay sa camera ✋";


    }

    catch (error) {

        console.error(error);


        startButton.disabled = false;

        startButton.innerText =
            "Try Again 📷";


        if (error.name === "NotAllowedError") {

            errorEl.innerText =
                "❌ Camera permission denied. " +
                "Pumunta sa browser Settings → " +
                "Site permissions → Camera → Allow.";
        }


        else if (error.name === "NotFoundError") {

            errorEl.innerText =
                "❌ Walang camera na nakita sa device.";
        }


        else if (error.name === "NotReadableError") {

            errorEl.innerText =
                "❌ Ginagamit ng ibang app ang camera. " +
                "Isara muna ang ibang camera app.";
        }


        else if (error.name === "SecurityError") {

            errorEl.innerText =
                "❌ Browser security blocked the camera. " +
                "Kailangan itong patakbuhin gamit ang HTTPS.";
        }


        else {

            errorEl.innerText =
                "❌ Camera error: " +
                error.message;
        }
    }
}


// ==========================================
// BUTTON
// ==========================================

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
